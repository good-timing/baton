[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["baton*"]

[project]
name = "baton-sdk"
version = "0.8.8"
description = "Baton — structured signal capture SDK that wraps a vendor's MCP server. Thin event emitter; Console worker assembles, interprets, dispatches."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Good Timing" },
]
keywords = ["mcp", "agents", "support", "signals", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # pydantic is the wire model. It is "free" for the PR-wrap GTM: the official
    # ``mcp`` package and ``fastmcp`` both already require it, so a wrapped vendor
    # inherits nothing new. UUIDv7 (event_id / session_id) is generated in-tree by
    # ``baton._uuid`` — stdlib ``uuid.uuid7`` on 3.14+, a monotonic RFC-9562
    # fallback below — so we take no ``uuid6`` dependency.
    "pydantic>=2.0",
    # ``httpx`` is ``HttpSink``'s async client, and a DSN always builds an
    # ``HttpSink``. CORE since 0.8.8. It was an ``[http]`` extra on the rule
    # above, and the rule stopped holding: ``mcp`` 2.x and ``fastmcp`` 4.x depend
    # on ``httpx2``, not ``httpx``, so a fresh ``pip install "baton-sdk[mcp]"``
    # could not run the DSN quickstart (measured 2026-09-15). A blocking client
    # (urllib) is not an alternative: the SDK emits from inside the event loop.
    "httpx>=0.25",
    # ``anyio`` runs vendor hooks off the event loop (``integrations/_hooks``).
    # CORE rather than an extra, decided 2026-09-11, and NOT free by the rule
    # above for every install (``httpx`` is the other): a LIBRARY-API user
    # (``Client`` / ``Trace``, no MCP server) installs it for a code path they
    # cannot reach. Taken deliberately — anyio is small and pure Python, and
    # the alternative was importing it inside the function, because
    # ``baton/__init__.py`` loads ``VendorConfig`` on every ``import baton``
    # and a module-scope import there broke ``import baton`` outright on a
    # core-only install. A lazy import that exists only to keep a dependency
    # list tidy is its own trap: it moves the failure from install time to
    # whichever tool call first runs a hook, and the next module-scope
    # ``import anyio`` anywhere under ``baton/`` re-breaks it silently.
    # For MCP vendors — everyone else — it stays free: ``mcp`` requires anyio
    # at every point in the supported band (1.20.0 ``anyio>=4.5``, 2.2.0
    # ``anyio>=4.10``) and ``fastmcp`` gets it through ``mcp``. The ``>=4.5``
    # floor matches the oldest ``mcp`` in band; nothing here uses anything
    # newer than ``to_thread.run_sync(abandon_on_cancel=...)``, which predates
    # it.
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://github.com/good-timing/baton"
Repository = "https://github.com/good-timing/baton"
Documentation = "https://github.com/good-timing/baton/tree/main/docs"
Issues = "https://github.com/good-timing/baton/issues"

# Optional dependencies for opt-in integrations. Vendors install only the
# integrations they need: `pip install baton-sdk[mcp]` for MCP-wrapping
# vendors; core SDK (library API + emitter) is always installed. Future
# integrations (managed-agents, a2a) added here as they land. See
# Sentry / Datadog / OpenTelemetry pattern: core SDK + opt-in integrations under baton.integrations.* with pip extras.
[project.optional-dependencies]
# ⚠ CEILING POLICY, decided 2026-09-10. Both integration extras carry an upper
# bound on the MAJOR (`mcp<3`, `fastmcp<5`), and they stay. A cap in a LIBRARY
# is a rule imposed on every customer's resolve, not a note to ourselves, so it
# is only defensible while it is maintained — and here it has been: `fastmcp<4`
# said something true (4.0 was tested and BROKEN, six adapter behaviours), and
# was lifted to `<5` when those were fixed rather than waived.
# **The rule is: review the cap per major, do not let it rot.** When a new major
# ships, add a matrix leg, fix what it breaks, then raise the bound. Leaving a
# cap in place because nobody looked is the failure mode; removing caps so
# nobody has to look is the other one.
# Caps never reach transitive deps — `mcp` arrives under `fastmcp` and no
# ceiling of ours bounds it. That gap is a lock file's job, not a cap's.
# Adapts the official Anthropic ``mcp`` package's server class — ``FastMCP``
# (``mcp.server.fastmcp``) on 1.x, renamed ``MCPServer`` (``mcp.server.mcpserver``)
# in 2.0. ``baton.integrations.official._compat`` resolves both; the internal struct
# the adapter wraps is preserved byte-for-byte across the rename.
# Minimum 1.20: earlier versions have a `Tool.from_function` bug that calls
# `issubclass(param.annotation, Context)` without first checking for
# stringified annotations from `from __future__ import annotations` (PEP 563),
# which crashes on any tool fn that uses future-annotations. Fixed upstream
# pre-1.20; we don't ship a workaround.
# Upper bound <3: 2.x is supported + CI-tested; cap guards against an untested
# future major (2.0 already renamed the server class + instructions backing).
mcp = [
    "mcp>=1.20,<3",
]
# Adapts the standalone ``fastmcp`` library's ``fastmcp.FastMCP`` (different
# project; advanced features like middleware not in the official SDK).
# Upper bound <5: 4.x is supported and the suite is verified green across the
# whole 2.x/3.x/4.x range, so this cap now guards an untested future major,
# exactly like mcp's <3. The previous <4 cap said something different — 4.0 was
# tested and BROKEN, six adapter behaviours failing — and it is lifted because
# those are fixed, not waived: session_id no longer rides fastmcp's per-request
# `Context.session_id`, param dispositions resolve from the server's own
# registry when a call arrives without a prior tools/list, and the surface
# snapshot dumps tools by wire alias so mcp 2.x emits `inputSchema` again.
# Note 4.x lifted fastmcp's own `mcp<2` pin, so an uncapped resolve pulls mcp
# 2.x in behind it; that combination is now a matrix axis rather than a
# surprise reaching the `core` job's typecheck.
# Floor 2.14 (was 2.10, which was fiction): 2.10/2.11 cannot `import fastmcp`
# at all under current pydantic ("cannot specify both default and
# default_factory"), and 2.12/2.13 fail this suite. 2.14 is the newest and only
# working 2.x band, and it is what `fastmcp-matrix` has always pinned for its
# 2.x leg — so this raises the declaration to match what is tested, and drops
# nothing that worked.
fastmcp = [
    "fastmcp>=2.14,<5",
]
# Kept so an existing ``baton-sdk[http]`` install line still resolves without a
# warning. httpx is a core dependency (see ``dependencies``).
http = [
    "httpx>=0.25",
]
all = [
    "baton-sdk[mcp]",
    "baton-sdk[fastmcp]",
    "baton-sdk[http]",
]
# Test tooling ALONE, no integrations. Split out of ``dev`` so a matrix leg can
# build the environment for ONE adapter without dragging the other adapter's
# library in behind it. ``mcp-matrix`` needs exactly that: it tests the official
# adapter against a pinned ``mcp``, and ``[dev]`` pulls ``fastmcp``, whose 4.x
# requires ``mcp>=2`` — so ``pip install -e ".[dev]" "mcp==1.20.0"`` is not
# merely slow, it is UNSATISFIABLE (measured 2026-09-10: pip backtracks to
# ``resolution-too-deep``). That is why that leg installed in two steps, and two
# steps is what leaves a mixed tree behind. One resolve of ``[mcp,test]`` has
# neither problem.
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-httpserver>=1.0",
    "jsonschema>=4.0",
]
dev = [
    "baton-sdk[all]",
    "baton-sdk[test]",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "T20",   # flake8-print — guards stdio safety (no print() in SDK code; would
             # corrupt the MCP JSON-RPC stream when wrapped under stdio transport)
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]  # tests may print for debugging

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: long-running (soak/stress); excluded from make test-fast",
    "integration: requires a real vendor package extra installed",
    "perf: wall-clock latency/overhead assertions; noisy on shared CI runners by nature, so CI-gated as continue-on-error rather than merge-blocking. Excluded from make test-fast.",
    "functional: deterministic (non-timing-based) correctness assertions that happen to live alongside the perf suite (whitelabel/boundary leaks, cross-capture-path envelope parity, fail-open-on-overflow correctness) -- these are NOT timing-flaky, so they run in the regular merge-blocking test job, not the advisory perf job. Excluded from make test-fast.",
]

[tool.coverage.run]
source_pkgs = ["baton"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
