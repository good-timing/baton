[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["baton*"]

[project]
name = "baton-sdk"
version = "0.5.0"
description = "Baton — structured signal capture SDK that wraps a vendor's MCP server. Thin event emitter; Console worker assembles, interprets, dispatches."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Good Timing" },
]
keywords = ["mcp", "agents", "support", "signals", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # pydantic is the wire model. It is "free" for the PR-wrap GTM: the official
    # ``mcp`` package and ``fastmcp`` both already require it, so a wrapped vendor
    # inherits nothing new. UUIDv7 (event_id / session_id) is generated in-tree by
    # ``baton._uuid`` — stdlib ``uuid.uuid7`` on 3.14+, a monotonic RFC-9562
    # fallback below — so we take no ``uuid6`` dependency. ``httpx`` is an optional
    # ``[http]`` extra (see below): only ``HttpSink`` needs it, and it too is free
    # on any mcp/fastmcp server.
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/good-timing/baton"
Repository = "https://github.com/good-timing/baton"
Documentation = "https://github.com/good-timing/baton/tree/main/docs"
Issues = "https://github.com/good-timing/baton/issues"

# Optional dependencies for opt-in integrations. Vendors install only the
# integrations they need: `pip install baton-sdk[mcp]` for MCP-wrapping
# vendors; core SDK (library API + emitter) is always installed. Future
# integrations (managed-agents, a2a) added here as they land. See
# Sentry / Datadog / OpenTelemetry pattern: core SDK + opt-in integrations under baton.integrations.* with pip extras.
[project.optional-dependencies]
# Adapts the official Anthropic ``mcp`` package's server class — ``FastMCP``
# (``mcp.server.fastmcp``) on 1.x, renamed ``MCPServer`` (``mcp.server.mcpserver``)
# in 2.0. ``baton.integrations.mcp._compat`` resolves both; the internal struct
# the adapter wraps is preserved byte-for-byte across the rename.
# Minimum 1.20: earlier versions have a `Tool.from_function` bug that calls
# `issubclass(param.annotation, Context)` without first checking for
# stringified annotations from `from __future__ import annotations` (PEP 563),
# which crashes on any tool fn that uses future-annotations. Fixed upstream
# pre-1.20; we don't ship a workaround.
# Upper bound <3: 2.x is supported + CI-tested; cap guards against an untested
# future major (2.0 already renamed the server class + instructions backing).
mcp = [
    "mcp>=1.20,<3",
]
# Adapts the standalone ``fastmcp`` library's ``fastmcp.FastMCP`` (different
# project; advanced features like middleware not in the official SDK).
fastmcp = [
    "fastmcp>=2.10",
]
# ``HttpSink`` (the production path — POST events to a Baton Console) needs an
# async HTTP client. httpx is required (not urllib): the SDK emits from inside
# the event loop, where a blocking client would stall it. Kept as an extra so
# the zero-infra demo path (stdout/file sinks, pure stdlib) installs nothing;
# httpx is already in any mcp/fastmcp server's tree, so this costs a real vendor
# nothing.
http = [
    "httpx>=0.25",
]
all = [
    "baton-sdk[mcp]",
    "baton-sdk[fastmcp]",
    "baton-sdk[http]",
]
dev = [
    "baton-sdk[all]",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-httpserver>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "T20",   # flake8-print — guards stdio safety (no print() in SDK code; would
             # corrupt the MCP JSON-RPC stream when wrapped under stdio transport)
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]  # tests may print for debugging

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source_pkgs = ["baton"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
