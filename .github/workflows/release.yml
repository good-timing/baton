# Publish baton-sdk to PyPI on version-tag push (e.g. `git tag v0.2.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) — no API token in repo secrets.
#
# One-time setup (see baton-internal/pypi-reservations/README.md or pypi.org/manage/
# project/baton-sdk/settings/publishing/):
#   - Add a Trusted Publisher on PyPI pointing at owner=good-timing,
#     repo=baton, workflow=release.yml, environment=pypi
#   - Create a `pypi` environment in repo Settings → Environments (optional
#     approval gate; recommended)

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Verify the tag matches pyproject.toml `version` before doing anything else.
  # Catches `git tag v0.2.0` against a repo that still says version = "0.1.0".
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PY_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PY_VERSION" >&2
            exit 1
          fi

  # Run the same gate CI uses, against the tagged commit, before building.
  ci:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Without the submodule, test_spec_conformance.py silently skips —
          # the release gate must actually pin the SDK against the spec schema.
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/baton
      - run: pytest -q

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/baton-sdk
    permissions:
      id-token: write   # required for OIDC; no PYPI_API_TOKEN secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
