# Baton SDK CI — lint + typecheck + test on every PR and push to main.
#
# Three jobs:
#   - `core`        — lint + typecheck + tests across the supported Python
#                     versions (3.11-3.14). Catches version-pin and
#                     stdlib-API regressions like the one that shipped 0.2.3
#                     effectively uninstallable. Excludes only the `perf`
#                     marker (see perf-timing below) — those specific tests
#                     assert on wall-clock timing, and running them across 4
#                     Python versions in parallel CI runners quadruples flake
#                     surface for no version-specific signal. The separate
#                     `functional` marker (tests/functional/, plus the
#                     fail-open correctness class in
#                     tests/perf/test_nonblocking_hotpath.py) is NOT excluded
#                     here — those assertions are deterministic (whitelabel
#                     string leaks, cross-path envelope-schema parity,
#                     fail-open-on-overflow), not timing-based, so they run
#                     as regular merge-blocking tests. Don't move them under
#                     `perf`/`perf-timing`'s continue-on-error — a prior
#                     version of this workflow did exactly that and let a
#                     real regression to any of them merge silently.
#   - `mcp-matrix`  — tests-only against multiple `mcp` package versions,
#                     since `baton.integrations.official` reaches into private
#                     internals (`_tool_manager._tools`, `Tool.fn`,
#                     `Tool.is_async`) per the API spike. The matrix guards
#                     against upstream churn.
#   - `perf-timing` — the wall-clock latency-ratio + overhead-budget subset
#                     only (`-m perf`), single Python version.
#                     `continue-on-error: true` for an initial soak-in period
#                     to collect real flake-rate data on GitHub's shared
#                     runners before this becomes a hard merge-blocking gate.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (from the LOCK)
        # `--locked` FAILS if uv.lock and pyproject.toml disagree instead of
        # re-resolving quietly, and `make install` runs this same command — so
        # a green local run and a green CI run describe the same tree. Three
        # bugs in four days came from them not doing so.
        # ⚠ The MATRIX jobs below deliberately do NOT use this, or uv at all:
        # their job is to float to what a customer resolves at a pin, and the
        # first attempt to move them onto uv reddened the fastmcp floor leg
        # (see that job's comment).
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --no-sync ruff check src/ tests/

      - name: Format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Typecheck
        run: uv run --no-sync mypy src/baton

      - name: Test
        run: uv run --no-sync pytest -q -m "not perf"

  perf-timing:
    # See the header comment above for why this is split out of `core` and
    # started as continue-on-error, and why it's scoped to `-m perf` only
    # (the deterministic `functional` marker runs in `core` instead). Uses
    # HttpSink's real defaults are NOT in play here — the tests deliberately
    # tighten retry/timeout/backoff (tests/perf/harness.py's
    # TIGHT_SINK_KWARGS) so they stay fast and deterministic; scripts/soak.py
    # (not run in CI) is what exercises the real defaults.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (from the LOCK)
        run: uv sync --locked --extra dev --python 3.14

      - name: Perf timing gate
        run: uv run --no-sync pytest tests/perf tests/functional -q -m perf

  mcp-matrix:
    # Verifies the baton.integrations.official adapter works against multiple
    # `mcp` package versions. The API spike found internals are bit-stable
    # across v1.10 → v2.0; this matrix proves it on every commit. mcp 2.0
    # renamed the server class + instructions backing (handled in _compat.py)
    # but preserved the tool-registry internals the adapter wraps.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version is mcp>=1.20 — earlier versions have an
        # upstream Tool.from_function bug with stringified annotations from
        # `from __future__ import annotations`. See pyproject [mcp] extra note.
        # 2.0.0 used to conflict with fastmcp's mcp<2 pin, and the old two-step
        # install forced it past that. It no longer arises: the install below
        # asks for `[mcp,test]`, so fastmcp is not in this leg's tree at all and
        # has no pin to conflict with. This leg only runs the mcp-adapter tests,
        # which import neither fastmcp nor httpx.
        mcp-version: ["1.20.0", "1.25.0", "1.27.2", "2.0.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (pin mcp in ONE resolve)
        # `[mcp,test]`, NOT `[dev]`. Two reasons, both measured 2026-09-10.
        # (1) `[dev]` drags `fastmcp`, whose 4.x needs `mcp>=2`, so a one-resolve
        #     `pip install -e ".[dev]" "mcp==1.20.0"` is UNSATISFIABLE — pip
        #     backtracks until `resolution-too-deep`. Hence the two-step install
        #     this replaces.
        # (2) Two steps is exactly the hybrid `fastmcp-matrix` was cured of: the
        #     first resolve installed fastmcp 4.0.3 + fastmcp-slim 4.0.3 + mcp
        #     2.2.0 + mcp-types 2.2.0, and downgrading `mcp` afterwards removed
        #     only `mcp` — leaving 2.2-era companions sitting beside mcp 1.20.0.
        #     Benign, because this leg imports none of them, but it means the leg
        #     was not the customer-shaped resolve it claims to test.
        # This leg only runs `tests/integrations/official/`, which imports
        # neither fastmcp nor httpx (checked), so dropping them costs no
        # coverage: 89 collected / 88 passed / 1 skipped either way.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,test]" "mcp==${{ matrix.mcp-version }}"

      - name: Prove the tree is the pin, and is not a hybrid
        # `mcp` exposes no `__version__`, so the fastmcp-matrix trick ("import it
        # and ask IT what it is") does not transfer — metadata is all there is,
        # and metadata is the half that LIED in the hybrid. So guard the failure
        # mode directly instead. Two different rules, because the two package
        # families mean different things here:
        #
        #   fastmcp / fastmcp-slim — must be ABSENT. This leg resolves
        #     `[mcp,test]`, so either one present means a second resolve
        #     happened and the tree is not what was asked for.
        #   mcp-types — must MATCH `mcp`, not be absent. mcp 2.x legitimately
        #     ships as two distributions, so its presence is normal on that
        #     band; what is never normal is a version SKEW between them, which
        #     is exactly the residue a downgrade leaves (`mcp` replaced,
        #     `mcp-types` left at the version the first resolve chose).
        #
        # ⚠ The first cut of this step failed the mcp 2.0.0 leg for having
        # `mcp-types 2.0.0`, treating a matched pair as a hybrid. Verified all
        # three ways since: matched 2.0.0 pair passes, planted `mcp-types 2.2.0`
        # beside `mcp 1.20.0` reds, and a clean 1.x tree with no `mcp-types` at
        # all passes.
        run: |
          pip list | grep -iE "^(mcp|mcp-types|fastmcp|fastmcp-slim|pydantic) " || true
          python - <<'PY'
          import sys
          from importlib.metadata import PackageNotFoundError, version

          want = "${{ matrix.mcp-version }}"
          got = version("mcp")
          if got != want:
              sys.exit(f"::error::resolved mcp {got}, pinned {want}")

          for foreign in ("fastmcp", "fastmcp-slim"):
              try:
                  bad = version(foreign)
              except PackageNotFoundError:
                  continue
              sys.exit(
                  f"::error::{foreign} {bad} is installed; this leg resolves"
                  " [mcp,test] and must not have it"
              )

          try:
              types_v = version("mcp-types")
          except PackageNotFoundError:
              types_v = None
          if types_v is not None and types_v != got:
              sys.exit(f"::error::mixed tree — mcp-types {types_v} beside mcp {got}")

          import mcp  # noqa: F401  — it must at least import

          print(f"mcp {got} imports; mcp-types {types_v or '<absent>'}; no fastmcp")
          PY

      - name: Test (mcp adapter only)
        # Scope to the official-mcp-SDK adapter tests. The fastmcp adapter is
        # NOT covered here — it pins its own mcp version transitively, so this
        # job cannot swing it. That is covered by `fastmcp-matrix` below, whose
        # absence is exactly how a `surface_snapshot` wire-format break on
        # mcp 2.x survived a green `mcp-matrix` (see CHANGELOG, `## Unreleased`).
        run: pytest tests/integrations/official/ -q

  fastmcp-matrix:
    # ⚠ STAYS ON pip + setup-python, and that is a decision, not an oversight.
    # Moving this job to `uv venv` + `uv pip install` (2026-09-10) reddened the
    # 2.14.7 leg: 25+ failures across test_install.py and test_intent_injection.py,
    # each burning ~20 s, where the same commit on pip ran 128 passed in 6 s.
    # The resolved tree was IDENTICAL — fastmcp 2.14.7, mcp 1.30.0, pydantic
    # 2.13.5 — so it is not a resolver difference; what changes is the
    # INTERPRETER, since `uv venv` uses uv's own standalone CPython rather than
    # setup-python's, and the per-test duration says timeout. `core` and
    # `perf-timing` run fine on that interpreter, so it is specific to this
    # job's fastmcp paths. Not diagnosed — reverted, because the leg's value is
    # testing the floor a customer gets and a customer's pip tree works.
    # If you move it, run the 2.14.7 leg before merging; it fails slowly, not loudly.
    #
    # Verifies the baton.integrations.standalone adapter against each major of the
    # standalone `fastmcp` library. This job exists because its absence hid a
    # real bug: `surface_snapshot` serialises tools via fastmcp's
    # `to_mcp_tool().model_dump()`, so the WIRE KEYS depend on the mcp version
    # fastmcp drags in behind it — and mcp 2.0 renamed them. `mcp-matrix` never
    # saw it (it only runs the official-SDK adapter, which hand-builds its
    # tool dicts) and `core` never saw it (one resolved fastmcp, one resolved
    # mcp). Each leg below pins fastmcp and lets it choose its own mcp, which
    # is what a customer's resolve actually does: 2.x/3.x pull mcp 1.x, 4.x
    # lifted fastmcp's `mcp<2` pin and pulls mcp 2.x.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One leg per supported major. The 2.x leg pins 2.14 because that is the
        # whole of the supported 2.x band: 2.10/2.11 cannot `import fastmcp` at
        # all under current pydantic (upstream: "cannot specify both default and
        # default_factory") and 2.12/2.13 have unrelated pre-existing gaps in
        # this suite. The `[fastmcp]` extra declared >=2.10 until D4 was settled;
        # it now declares >=2.14, so this pin IS the floor rather than a silent
        # departure from it.
        fastmcp-version: ["2.14.7", "3.4.2", "4.0.2"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (pin fastmcp in ONE resolve)
        # Deliberately NOT `pip install -e ".[dev]"` followed by a downgrade.
        # `[dev]` resolves fastmcp 4.x, which ships its modules in a SEPARATE
        # distribution (`fastmcp-slim`); downgrading `fastmcp` afterwards does
        # not remove that, so site-packages ends up holding 4.x code under a
        # 2.x version label — a hybrid matching no release anyone can install.
        # Measured 2026-09-08, the first time this job ever ran: the 2.14.7 leg
        # died collecting, on `ImportError: cannot import name
        # 'IdentityAssertionParams' from 'mcp.server.auth.provider'` — 4.x
        # oauth_proxy code against the mcp 1.30.0 that 2.14.7 correctly pulled.
        # One resolve carrying both constraints keeps fastmcp-slim out entirely.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "fastmcp==${{ matrix.fastmcp-version }}"

      - name: Show resolved fastmcp + mcp, and prove the pin is what imports
        # The mcp version is the point of this matrix, so print what resolved
        # rather than inferring it from the fastmcp pin. The import check is the
        # guard the hybrid above walked straight through: metadata said 2.14.7
        # while the importable package was 4.0.3, so a version-label assertion
        # alone would have passed. Import it and ask IT what it is.
        run: |
          pip list | grep -iE "^(mcp|mcp-types|fastmcp|fastmcp-slim|pydantic) " || true
          python - <<'PY'
          import sys
          import fastmcp
          want = "${{ matrix.fastmcp-version }}"
          got = getattr(fastmcp, "__version__", "<none>")
          print(f"imported fastmcp {got}; pinned {want}")
          if got != want:
              sys.exit(f"::error::hybrid install — imported {got}, pinned {want}")
          PY

      - name: Test (fastmcp adapter + cross-path functional + entry-point routing)
        # Wider than mcp-matrix's scope on purpose: `tests/functional/` is where
        # envelope/spec-conformance lives, and a wire-format regression from the
        # mcp version underneath fastmcp shows up there, not only in the
        # adapter's own tests.
        #
        # `test_entry_point_routing.py` is here because 0.7.0 shipped a router
        # that refused every fastmcp 2.x server and NO leg could see it: this
        # job pins 2.14 but did not run the routing test, and `core` runs the
        # routing test but resolves fastmcp 4.x, where the `_tool_manager` that
        # caused the refusal does not exist. Two green legs, one broken entry
        # point, and the gap was the intersection neither covered — the same
        # shape as the fastmcp-slim hybrid this job's own guard was added for.
        run: >
          pytest tests/integrations/standalone/ tests/functional/
          tests/test_entry_point_routing.py -q
