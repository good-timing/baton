# Baton SDK CI — lint + typecheck + test on every PR and push to main.
#
# Two jobs:
#   - `core`       — lint + typecheck + tests across the supported Python
#                    versions (3.11-3.14). Catches version-pin and stdlib-API
#                    regressions like the one that shipped 0.2.3 effectively
#                    uninstallable.
#   - `mcp-matrix` — tests-only against multiple `mcp` package versions, since
#                    `baton.integrations.mcp` reaches into private internals
#                    (`_tool_manager._tools`, `Tool.fn`, `Tool.is_async`) per
#                    the API spike. The matrix guards against upstream churn.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Typecheck
        run: mypy src/baton

      - name: Test
        run: pytest -q

  mcp-matrix:
    # Verifies the baton.integrations.mcp adapter works against multiple
    # `mcp` package versions. The API spike found internals are bit-stable
    # across v1.10 → v2.0; this matrix proves it on every commit. mcp 2.0
    # renamed the server class + instructions backing (handled in _compat.py)
    # but preserved the tool-registry internals the adapter wraps.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version is mcp>=1.20 — earlier versions have an
        # upstream Tool.from_function bug with stringified annotations from
        # `from __future__ import annotations`. See pyproject [mcp] extra note.
        # 2.0.0 conflicts with fastmcp's mcp<2 pin, but the override install
        # below forces it; this leg only runs the mcp-adapter tests, which
        # never import the standalone fastmcp library.
        mcp-version: ["1.20.0", "1.25.0", "1.27.2", "2.0.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (override mcp version)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp==${{ matrix.mcp-version }}"

      - name: Test (mcp adapter only)
        # Scope to the official-mcp-SDK adapter tests — the fastmcp adapter
        # and core tests are covered by the `core` job above and don't depend
        # on the mcp package version.
        run: pytest tests/integrations/mcp/ -q
